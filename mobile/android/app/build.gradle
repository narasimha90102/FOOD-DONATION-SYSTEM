apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../../")
}

android {
    ndkVersion "26.3.11579264"
    buildToolsVersion "35.0.0"
    compileSdk 35

    namespace "com.foodbridge"
    defaultConfig {
        applicationId "com.foodbridge"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        prefab true
    }
}

project.ext.REACT_NATIVE_NODE_MODULES_DIR = "${rootProject.projectDir}/../node_modules/react-native"
project.ext.compileSdkVersion = rootProject.ext.compileSdkVersion
project.ext.minSdkVersion = rootProject.ext.minSdkVersion
project.ext.targetSdkVersion = rootProject.ext.targetSdkVersion

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle");
applyNativeModulesAppBuildGradle(project)

dependencies {
    implementation("com.facebook.react:react-android")
}


