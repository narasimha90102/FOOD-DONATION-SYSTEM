pluginManagement {
    def gradlePluginPath = new File(settingsDir, "../node_modules/@react-native/gradle-plugin")
    if (!gradlePluginPath.exists()) {
        gradlePluginPath = new File(settingsDir, "../../node_modules/@react-native/gradle-plugin")
    }
    includeBuild(gradlePluginPath)
}
plugins {
    id("com.facebook.react.settings")
}
rootProject.name = 'FoodBridge'
include ':app'
