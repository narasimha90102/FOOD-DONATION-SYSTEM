version: '3.8'

services:
  # 1. Database Service
  mongodb:
    image: mongo:latest
    container_name: foodbridge_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - foodbridge_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node Express API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge_backend
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/foodbridge
      - JWT_SECRET=production_ultra_secret_key_8392_fb
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - foodbridge_network

  # 3. NextJS 15 Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodbridge_frontend
    ports:
      - "3003:3003"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5003/api
      - NEXT_PUBLIC_SOCKET_URL=http://backend:5003
      - PORT=3003
    depends_on:
      - backend
    networks:
      - foodbridge_network

volumes:
  mongo_data:

networks:
  foodbridge_network:
    driver: bridge
