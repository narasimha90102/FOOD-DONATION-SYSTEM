name: FoodBridge AI - Build Android APK Only

on:
  push:
    branches: [ main, master, release ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.22.1'

      - name: Install Mobile Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
        working-directory: mobile

      - name: Build Android Debug APK (Gradle)
        env:
          NODE_ENV: production
          _JAVA_OPTIONS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
        working-directory: mobile/android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodbridge-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
