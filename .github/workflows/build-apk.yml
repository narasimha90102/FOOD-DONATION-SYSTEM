name: FoodBridge AI - Build Android APK

on:
  push:
    branches: [ main, master, release ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Native Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean ALL Stale Native Build Artifacts
        run: |
          echo "Removing stale Gradle caches..."
          rm -rf ~/.gradle/caches/ ~/.gradle/wrapper/
          rm -rf mobile/android/.gradle/ mobile/android/build/
          rm -rf mobile/android/app/build/
          rm -rf mobile/android/app/.cxx/
          rm -rf mobile/android/.cxx/
          echo "Removing stale node_modules build artifacts..."
          rm -rf mobile/node_modules/react-native-screens/android/build/
          rm -rf mobile/node_modules/react-native-screens/android/.cxx/
          echo "Clearing Gradle daemon processes..."
          pkill -9 -f "gradle" || true
          sleep 2

      - name: Clean node_modules and reinstall
        run: |
          echo "Removing node_modules..."
          rm -rf mobile/node_modules/
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
        working-directory: mobile

      - name: Verify React Native Gradle Plugin Installed
        run: |
          test -d node_modules/@react-native/gradle-plugin || (echo "Error: @react-native/gradle-plugin missing" && exit 1)
          echo "@react-native/gradle-plugin found successfully"
        working-directory: mobile

      - name: Verify & Prepare Gradle Wrapper
        working-directory: mobile/android
        run: |
          ls -la
          test -f gradlew || (echo "Error: gradlew missing" && exit 1)
          test -f gradlew.bat || (echo "Error: gradlew.bat missing" && exit 1)
          test -f gradle/wrapper/gradle-wrapper.jar || (echo "Error: gradle-wrapper.jar missing" && exit 1)
          test -f gradle/wrapper/gradle-wrapper.properties || (echo "Error: gradle-wrapper.properties missing" && exit 1)
          chmod +x gradlew

      - name: Print Toolchain Diagnostics & Export NDK Env
        run: |
          node --version
          npm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          ls -la "$ANDROID_HOME/ndk/26.3.11579264" || true

      - name: Clean & Build Android Debug APK
        env:
          NODE_ENV: production
          ANDROID_GRADLE_PLUGIN_CHECK_SDK_FOLDER_COMPATIBILITY: "false"
          _JAVA_OPTIONS: "-Xmx6144m -XX:MaxMetaspaceSize=2048m"
          GRADLE_OPTS: "-Dorg.gradle.cxx.cmake.version=3.28.0 -Dorg.gradle.cxx.ndk.version=26.3.11579264"
        run: |
          ./gradlew clean --no-daemon --stacktrace
          ./gradlew assembleDebug --no-daemon --stacktrace --info
        working-directory: mobile/android

      - name: Verify APK Artifact Exists
        run: |
          ls -lah mobile/android/app/build/outputs/apk/debug/app-debug.apk || exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodbridge-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
